name: on commit checks

# The workflow_run trigger runs the checks after the Dependabot lock file update, on the head of
# the Dependabot branch. It only runs the build with read permissions and no secrets, and only
# for successful runs started by Dependabot on branches of this repository.
on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
    # Allow manual dispatch.

  push:
    branches: [ "master" ]

  # Any pull request, whatever its base, so that stacked pull requests are checked too.
  pull_request:

  workflow_run:
    workflows: ["Dependabot PR lock file update"]
    types:
      - completed

# The build only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still in progress. The event
# name keeps workflow_run builds (whose github.ref is master) apart from builds of master itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: gradle check (JDK ${{ matrix.java }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      (github.event_name != 'workflow_run' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    strategy:
      matrix:
        # Windows exercises the native console width detection for real.
        os: [ ubuntu-latest, windows-latest ]
        java: [ '25' ]

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For workflow_run events, build the current head of the Dependabot branch (which
          # includes the lock file commit, if one was pushed) instead of the default branch.
          ref: ${{ github.event.workflow_run.head_branch || '' }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Tests (./gradlew ... check)
        run: ./gradlew check

      - name: Store failed test outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-outputs-${{ matrix.os }}
          path: '**/OUTPUT-*.txt'

  test-console-aware:
    name: Smoke test the published jar (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name != 'workflow_run'
    strategy:
      matrix:
        java-version: [25]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the jar
        run: ./gradlew :progresso:jar

      - name: Test ConsoleAware invocation
        # Passed through the environment rather than expanded into the script, see
        # https://docs.zizmor.sh/audits/#template-injection
        env:
          JAVA_VERSION: ${{ matrix.java-version }}
        run: |
          OUTPUT=$(java -cp progresso/build/libs/progresso-*.jar com.carrotsearch.progresso.views.console.ConsoleAware)
          echo "Output: $OUTPUT"
          if [[ $OUTPUT == Console* ]]; then
            echo "✓ ConsoleAware test passed on JDK ${JAVA_VERSION}"
          else
            echo "✗ ConsoleAware test failed: output does not start with 'Console'"
            echo "Actual output: $OUTPUT"
            exit 1
          fi
