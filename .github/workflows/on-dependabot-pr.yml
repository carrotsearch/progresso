name: Dependabot PR lock file update

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

# A newer push to the same pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Update the Gradle lock file
    # The actor check is intentional: this job only updates the lock file on Dependabot's pull
    # requests. The push below uses GITHUB_TOKEN, so it does not trigger any further workflow runs.
    if: ${{ github.actor == 'dependabot[bot]' }} # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commits the regenerated lock file back to the pull request branch
    steps:
      # Credentials are persisted deliberately: the final step pushes with the default GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Update Gradle Verification Metadata
        run: ./gradlew writeLocks

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: update gradle lock file" || echo "No changes to commit"
          git push
