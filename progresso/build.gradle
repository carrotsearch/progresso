// The demos (src/test/java/.../demos) are not unit tests: run them with
//   ./gradlew :progresso:demos -Ptests.verbose=true
tasks.register('demos', Test) {
  description = 'Runs the console view demos (E0xx classes) with their output echoed.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  setIncludes(['**/demos/E*.class'])
  setExcludes([])
  outputs.upToDateWhen { false }
}

// Demo is the module's entry point: java -jar progresso-*.jar, or java -p ... -m com.carrotsearch.progresso
def demoClass = 'com.carrotsearch.progresso.Demo'

tasks.named('compileJava') {
  options.javaModuleMainClass = demoClass
}

tasks.named('jar') {
  manifest {
    attributes("Main-Class": demoClass)
  }
}

// Assembles build/demo with this module and the console width suppliers, ready to run the Demo
// entry point with every supplier on the module path:
//   ./gradlew :progresso:demo
configurations {
  demo
}

dependencies {
  demo project(':progresso-consolewidth-unixish')
  demo project(':progresso-consolewidth-windows')
}

tasks.register('demo', Sync) {
  description = 'Assembles build/demo (progresso and the console width modules) and prints how to run the demo.'
  group = 'verification'

  from configurations.demo
  into layout.buildDirectory.dir('demo')

  // Always run, so that the command line below is printed even when the jars are current.
  outputs.upToDateWhen { false }

  def demoDir = rootProject.relativePath(layout.buildDirectory.dir('demo').get())
  doLast {
    println """
Demo assembled in ${demoDir}. Run it with every console width supplier on the module path:

  java --enable-native-access=com.carrotsearch.progresso.windows -p ${demoDir} -m com.carrotsearch.progresso

Force a style with -Dconsole.progressbar=ascii|shades|blocks|line|braille.
"""
  }
}
