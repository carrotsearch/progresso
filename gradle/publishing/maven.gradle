// Publishing to Maven Central (via Sonatype's Central Portal): a bundle upload
// for releases, the snapshot repository for snapshots.
//
//   ./gradlew publishToMavenCentral
//
// The plugin itself (MavenCentralPublishingPlugin from buildinfra) is applied in the root
// build script: buildinfra classes are not visible from script plugins.
//
// 'publishLocal' and 'prepareMavenCentralBundle' can be used to inspect
// what would be published (build/maven, build/maven-bundle).

configure(rootProject) {
  mavenCentralPublishing {
    // Do not generate or publish gradle metadata files.
    gradleModuleMetadata = false

    pom {
      url = 'https://github.com/carrotsearch/progresso'
      inceptionYear = "2017"

      licenses {
        license {
          name = 'The Apache Software License, Version 2.0'
          url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        }
      }

      organization {
        name = "Carrot Search s.c."
        url = "https://www.carrotsearch.com"
      }

      developers {
        developer {
          id = 'dawid.weiss'
          name = 'Dawid Weiss'
          email = 'dawid.weiss@carrotsearch.com'
        }
      }

      scm {
        connection = 'scm:git:git@github.com:carrotsearch/progresso.git'
        developerConnection = 'scm:git:git@github.com:carrotsearch/progresso.git'
        url = 'https://github.com/carrotsearch/progresso'
      }
    }

    [
      ":progresso": "A task management/ reporting library with console progress tracking facilities.",
      ":progresso-log4j": "Progresso (Log4j2 integration)",
      ":progresso-consolewidth-unixish": "Progresso (Console width detection, Unixish systems)",
      ":progresso-consolewidth-windows": "Progresso (Console width detection, Windows)",
      ":progresso-jvmversion": "Progresso (jvm version echo for scripts)",
    ].each { path, projectDescription ->
      project(path) {
        pom {
          // The artifact id (base.archivesName) may differ from the project name.
          name = rootProject.project(path).base.archivesName.get()
          description = projectDescription
        }
      }
    }
  }
}
