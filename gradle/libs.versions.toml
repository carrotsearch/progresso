[versions]
# @keep This project's version.
progresso = "2.0.0"
log4j = "2.25.4"
jline = "4.4.8"
randomizedtesting = "2.9.2"
# @keep This is the minimum required Java version.
minJava = "25"
# @keep This is GJF version for spotless/ tidy.
googleJavaFormat = "1.36.1"
# @keep spotless formatting of groovy/gradle files
greclipse = "4.26"

[libraries]
assertj = { module = "org.assertj:assertj-core", version = { strictly = "3.27.7" } }
jline-terminal = { module = "org.jline:jline-terminal", version.ref = "jline" }
jline-terminal-ffm = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }
junit = { module = "junit:junit", version = { strictly = "4.13.2" } }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
randomizedtesting-runner = { module = "com.carrotsearch.randomizedtesting:randomizedtesting-runner", version.ref = "randomizedtesting" }

[plugins]
buildinfra = "com.carrotsearch.gradle.buildinfra:0.0.27"
